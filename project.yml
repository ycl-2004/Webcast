name: Webcast
options:
  defaultConfig: Release
  developmentLanguage: zh_CN
  bundleIdPrefix: dev.yc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "27.0"
packages:
  GoogleCast:
    path: Packages/GoogleCast
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  Webcast:
    type: application
    platform: iOS
    sources:
      - path: Webcast
        excludes:
          - Sniffer/sniff.js
          - Resources
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: Webcast/Sniffer/sniff.js
        buildPhase: resources
      - path: Webcast/Resources
        buildPhase: resources
      - path: Webcast/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Webcast/Info.plist
      properties:
        CFBundleDisplayName: Webcast
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "4"
        WebcastBuildConfiguration: $(CONFIGURATION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: 连接同一 Wi-Fi 下的 Chromecast，将你选择的视频投到电视。
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yc.Webcast
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WebcastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/Swift]
    dependencies:
      - target: Webcast
      - package: GoogleCast
        product: GoogleCastDynamic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WebcastReceiverTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/Receiver]
    dependencies:
      - target: Webcast
      - package: GoogleCast
        product: GoogleCastDynamic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Webcast:
    build:
      targets:
        Webcast: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
    test:
      config: Debug
      environmentVariables:
        WEBCAST_OFFLINE_VALIDATION: "1"
      targets:
        - WebcastTests
  WebcastReceiverAcceptance:
    build:
      targets:
        Webcast: all
        WebcastReceiverTests: [test]
    test:
      config: Debug
      environmentVariables:
        WEBCAST_OFFLINE_VALIDATION: "1"
      targets:
        - WebcastReceiverTests
